<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEP – Prontuário Eletrônico</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--side:#0f1b2d;--side2:#18283f;--ink:#152033;--mut:#6b7a90;--line:#e5eaf2;
  --pri:#2563eb;--pri-soft:#e8efff;--ok:#12805c;--ok-soft:#dcf5ea;--warn:#a85a00;--warn-soft:#fff0d6;--bad:#c62828;--bad-soft:#fde4e4;
  --r:14px;--sh:0 1px 2px #0b1a3012,0 4px 16px #0b1a300a
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220;--panel:#141d2e;--side:#070d18;--side2:#101a2b;--ink:#e6ecf5;--mut:#8b9bb3;--line:#223049;
  --pri:#5b8cff;--pri-soft:#1b2a4d;--ok:#4cd2a1;--ok-soft:#10372c;--warn:#ffbf5c;--warn-soft:#3b2a0c;--bad:#ff7b7b;--bad-soft:#3d1717;--sh:none}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100%}
/* sidebar */
aside{background:var(--side);color:#cfd9ea;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#22d3ee);display:grid;place-items:center;color:#fff}
.search{position:relative}
.search input{width:100%;background:var(--side2);border:1px solid #243551;color:#fff;border-radius:10px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:11px;color:#7c8ba3}
.plist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px}
.pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.pi:hover{background:var(--side2)}.pi.on{background:#1d3157;border-color:#2c4a80}
.pi b{display:block;color:#fff;font-weight:600;font-size:13.5px}.pi small{color:#8ea0bd}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.sidefoot{display:grid;gap:6px}
/* main */
main{padding:22px 28px 60px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .who{color:var(--mut)}.top select{width:auto}
.demo{background:var(--warn-soft);color:var(--warn);padding:6px 12px;border-radius:10px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phead .av{width:64px;height:64px;font-size:22px}
.phead h2{margin:0;font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
.alert{margin-top:10px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 12px;display:inline-block;font-weight:600}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:9px;cursor:pointer;font:inherit;font-weight:500}
.tabs button.on{background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat b{font-size:26px;display:block}.stat span{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* controls */
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--pri);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
aside .btn.ghost{color:#cfd9ea;border-color:#243551}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--panel);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:110px}.row>.fix{flex:none;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.head h3{margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pri-soft);color:var(--pri)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.item .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.item p{margin:3px 0;white-space:pre-wrap}.item .acts{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--mut);padding:28px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
.timeline .item{position:relative}.timeline .item:before{content:"";position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:3px solid var(--bg)}
.file{display:inline-flex;gap:6px;align-items:center;background:var(--pri-soft);color:var(--pri);border-radius:8px;padding:3px 8px;font-size:12.5px;margin:2px 4px 2px 0}
.file a{color:inherit;text-decoration:none;cursor:pointer}
.sigbox{margin-top:8px;font-size:12px;color:var(--ok);background:var(--ok-soft);padding:6px 10px;border-radius:8px;word-break:break-all}
/* dialog */
dialog{border:0;border-radius:18px;padding:22px;width:min(680px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0007}
dialog.wide{width:min(820px,95vw)}
dialog::backdrop{background:#0a122399;backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:18px}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1}
#print{display:none}
#auth{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);place-items:center;padding:16px}
#auth form{width:min(400px,100%);margin:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}.plist{max-height:190px}
  main{padding:16px}.two{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}.app,dialog,#toast{display:none!important}
  #print{display:block;font:14px/1.5 Georgia,serif;padding:10mm}
  #print h2{margin:0 0 4px}#print hr{margin:10px 0}#print .sig{margin-top:40px;font:11px/1.4 monospace;border-top:1px solid #000;padding-top:6px;word-break:break-all}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 5v14M5 12h14"/></svg></div>PEP Clínico</div>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar paciente, CPF, CNS…"></div>
    <button class="btn" id="novoPac"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Novo paciente</button>

      <button class="btn ghost sm" id="exp"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg> Exportar backup</button>
      <button class="btn ghost sm" id="imp"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4M4 21h16"/></svg> Importar backup</button>

</div>
<div id="print"></div>
<div id="auth"><form id="aForm" class="card"><h3 style="font-size:20px">Entrar no PEP</h3><p style="color:var(--mut);margin:0">Acesso restrito. Seus dados ficam na sua conta.</p>
  <label>E-mail</label><input id="aEmail" type="email" required autocomplete="username"><label>Senha</label><input id="aPass" type="password" required minlength="8" autocomplete="current-password">
  <div id="aMsg" style="color:var(--bad);min-height:20px;margin-top:8px"></div>
  <div class="bar" style="justify-content:space-between"><button type="button" class="btn ghost" id="aSign">Criar conta</button><button class="btn">Entrar</button></div></form></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<div id="toast"></div>
<input type="file" id="upFile" accept=".pdf,image/*" multiple hidden>
<datalist id="dlCid"></datalist><datalist id="dlMed"></datalist><datalist id="dlExame"></datalist>

<script>
"use strict";
/* =============== constantes =============== */
const KEY="pep-demo-v1";
/* Supabase: preencha as duas linhas abaixo (Project Settings → API). Vazio = modo local (navegador). */
const SUPABASE_URL="https://joygodczajayygjxerno.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpveWdvZGN6YWpheXlnanhlcm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxODI5MjMsImV4cCI6MjEwODc1ODkyM30.D5WdaqV6k1oN19TTffLPQ1NQejBFu91p9nlT2kV51Rs";   // chave "anon public" (a service_role NUNCA entra aqui)
const SB_ON=!!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);
const sb=SB_ON?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let UID=null;
const CID=[["I10","Hipertensão essencial"],["E11","Diabetes mellitus tipo 2"],["E78","Dislipidemia"],["J06","Infecção aguda de vias aéreas superiores"],["J45","Asma"],["M54","Dorsalgia"],["N39","Transtornos do trato urinário (ITU)"],["F32","Episódio depressivo"],["F41","Transtornos ansiosos"],["K29","Gastrite e duodenite"],["R51","Cefaleia"],["Z00","Exame médico geral"],["G30","Doença de Alzheimer"],["F03","Demência não especificada"],["E03","Hipotireoidismo"]];

const EXAMES=[["Hemograma completo","Laboratorial"],["Glicemia de jejum","Laboratorial"],["Hemoglobina glicada","Laboratorial"],["Colesterol total e frações","Laboratorial"],["Triglicerídeos","Laboratorial"],["Creatinina","Laboratorial"],["Ureia","Laboratorial"],["TSH","Laboratorial"],["Vitamina B12","Laboratorial"],["EAS (urina tipo 1)","Laboratorial"],["Urocultura","Laboratorial"],["TGO/TGP","Laboratorial"],["Raio-X de tórax PA e perfil","Imagem"],["Ecografia de abdome total","Imagem"],["Ecografia de tireoide","Imagem"],["Mamografia bilateral","Imagem"],["RM de crânio","Imagem"],["ECG","Imagem"]];
const CARATER=["Eletivo","Urgência","Acidente de trabalho","Demanda espontânea","Retorno"];
const STATUS_EX=["Solicitado","Coletado","Em análise","Resultado","Cancelado"];
const STCOLOR={Solicitado:"warn",Coletado:"",["Em análise"]:"",Resultado:"ok",Cancelado:"bad"};

/* =============== utilidades =============== */
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdate=d=>d?new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
const fday=d=>d?new Date(d+"T12:00").toLocaleDateString("pt-BR"):"";
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const idade=n=>{if(!n)return"";const d=new Date(n),h=new Date();let a=h.getFullYear()-d.getFullYear();if(h<new Date(h.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const ICO={plus:"M12 5v14M5 12h14",print:"M6 9V3h12v6M6 18H4v-7h16v7h-2M6 14h12v7H6z",pen:"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",trash:"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14",clip:"M21 12l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8",copy:"M9 9h11v11H9zM5 15V4h11",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",lock:"M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5z",dl:"M12 3v12m0 0-4-4m4 4 4-4M4 21h16",check:"M20 6 9 17l-5-5",edit:"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${ICO[n]}"/></svg>`;
const COLORS=["#3b82f6","#8b5cf6","#ec4899","#f59e0b","#10b981","#06b6d4","#ef4444"];
const avatar=(p,cls="")=>{const ini=p.nome.replace(/\(.*\)/,"").trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();const c=COLORS[[...p.id].reduce((a,x)=>a+x.charCodeAt(0),0)%COLORS.length];return `<div class="av ${cls}" style="background:${c}">${ini}</div>`};
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}

/* =============== armazenamento de arquivos (IndexedDB) =============== */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("pep-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idb=async(mode,fn)=>{const db=await DB;return new Promise((res,rej)=>{const rq=fn(db.transaction("f",mode).objectStore("f"));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})};
const bucket=()=>sb.storage.from("exames");
const chk=r=>{if(r.error)throw r.error;return r};
const fPut=async(id,blob)=>SB_ON?void chk(await bucket().upload(UID+"/"+id,blob,{upsert:true,contentType:blob.type||undefined})):idb("readwrite",s=>s.put(blob,id));
const fGet=async id=>SB_ON?(await bucket().download(UID+"/"+id)).data:idb("readonly",s=>s.get(id));
const fDel=async id=>SB_ON?void chk(await bucket().remove([UID+"/"+id])):idb("readwrite",s=>s.delete(id));
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});

/* =============== dados =============== */
function seed(){return {cur:"p1",pacs:[
 {id:"p1",nome:"Maria Aparecida da Silva (FICTÍCIA)",social:"",sexo:"F",nasc:"1948-03-14",raca:"Parda",cns:"700 0000 0000 0001",cpf:"000.000.000-01",pront:"10001",end:"Rua Exemplo, 100 – Itapevi/SP",tel:"(11) 90000-0001",equipe:"INE 0000001 – ESF Jardim Fictício",alergias:"Dipirona (urticária)",
  aten:[{id:uid(),data:"2026-09-10T09:00",carater:"Eletivo",vit:{pa:"138/82",fc:"72",temp:"36,5",peso:"68",sat:"97"},S:"Queixa de esquecimentos há 1 ano. Filha refere perda de objetos e repetição de perguntas.",O:"MEEM 22/30.",A:"Comprometimento cognitivo – investigar.",P:"Solicitar exames de rastreio de causas reversíveis. Retorno em 30 dias.",cids:["F03 – Demência não especificada","I10 – Hipertensão essencial"],proc:"Consulta médica (03.01.01.007-2)",assinado:true,assinadoEm:"2026-09-10T09:40:00"}],
  presc:[{id:uid(),data:"2026-09-10T09:30",itens:[{med:"Losartana 50 mg cp",dose:"1 comprimido",via:"VO",freq:"12/12h",dur:"uso contínuo"}],assinatura:null}],
  exames:[{id:uid(),data:"2026-09-10T09:30",nome:"TSH",tipo:"Laboratorial",status:"Resultado",ind:"Investigação de declínio cognitivo",res:"2,1 mUI/L (normal)",anexos:[]},{id:uid(),data:"2026-09-10T09:30",nome:"Vitamina B12",tipo:"Laboratorial",status:"Solicitado",ind:"Investigação de declínio cognitivo",res:"",anexos:[]}]},
 {id:"p2",nome:"José Carlos Pereira (FICTÍCIO)",social:"",sexo:"M",nasc:"1975-11-02",raca:"Branca",cns:"700 0000 0000 0002",cpf:"000.000.000-02",pront:"10002",end:"Av. Modelo, 45 – Barueri/SP",tel:"(11) 90000-0002",equipe:"INE 0000002 – ESF Centro Fictício",alergias:"Nenhuma conhecida",aten:[],presc:[],exames:[]}]}}
let S=SB_ON?{cur:null,pacs:[]}:(()=>{try{return JSON.parse(localStorage[KEY])}catch{return seed()}})();
/* Persistência: cada paciente é uma linha da tabela "pacientes" (documento jsonb). Só o que mudou é enviado. */
let synced=new Map(),syncTimer,syncQ=Promise.resolve();
function save(){
  if(!SB_ON){try{localStorage[KEY]=JSON.stringify(S)}catch{toast("Aviso: não foi possível salvar no navegador")}return}
  try{localStorage["pep-cur"]=S.cur||""}catch{}
  if(!UID)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncQ=syncQ.then(syncRemote)},400);
}
async function syncRemote(){
  try{
    const cur=new Map(S.pacs.map(p=>[p.id,JSON.stringify(p)]));
    const up=S.pacs.filter(p=>synced.get(p.id)!==cur.get(p.id));
    const del=[...synced.keys()].filter(id=>!cur.has(id));
    if(up.length){chk(await sb.from("pacientes").upsert(up.map(p=>({owner_id:UID,id:p.id,nome:p.nome,dados:p,updated_at:new Date().toISOString()})),{onConflict:"owner_id,id"}));up.forEach(p=>synced.set(p.id,cur.get(p.id)))}
    if(del.length){chk(await sb.from("pacientes").delete().in("id",del));del.forEach(id=>synced.delete(id))}
  }catch(e){toast("Erro ao salvar no servidor: "+(e.message||e))}
}
async function loadRemote(){
  const r=chk(await sb.from("pacientes").select("id,dados").order("created_at"));
  S.pacs=r.data.map(x=>x.dados);synced=new Map(S.pacs.map(p=>[p.id,JSON.stringify(p)]));
  let c="";try{c=localStorage["pep-cur"]}catch{}S.cur=S.pacs.some(p=>p.id===c)?c:S.pacs[0]?.id||null;
}
const P=()=>S.pacs.find(p=>p.id===S.cur)||S.pacs[0];
let tab="Resumo",filtroEx="";
const TABS=["Resumo","Atendimentos","Evolução","Prescrições","Exames"];

/* =============== assinatura eletrônica (ponto de integração) ===============
   Para ligar um certificado em nuvem (ex.: VIDaaS, BirdID, SafeID, gov.br),
   registre um provedor em Signer.providers com um método sign(hashHex, ctx)
   que faça o fluxo OAuth/PSC do provedor e devolva {signature, signer, cert}.
   O hash SHA-256 do conteúdo clínico é calculado aqui; o conteúdo assinado
   fica travado (não editável) depois de assinado.                                */
const Signer={providers:{demo:{label:"Simulado (demonstração)",async sign(hash){return{signature:"DEMO-"+hash.slice(0,24),signer:"Dr(a). Fernando (assinatura simulada)",cert:"Sem validade legal"}}}}};
async function sha256(s){if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return("00000000"+(h>>>0).toString(16)).repeat(8)}
const canon=(tipo,pac,obj)=>JSON.stringify({tipo,pac:{id:pac.id,nome:pac.nome,cns:pac.cns,cpf:pac.cpf},doc:obj});
function signDialog(tipo,obj,done){
  const pac=P();
  modal(`<h3>Assinar eletronicamente</h3><p style="color:var(--mut);margin:0">O conteúdo será travado após a assinatura.</p>
  <form><label>Provedor de certificado</label><select name="prov">${Object.entries(Signer.providers).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join("")}</select>
  <p style="color:var(--mut);font-size:12.5px">Os provedores de certificado em nuvem (ICP-Brasil) serão adicionados aqui. Por ora só a assinatura simulada, sem validade legal.</p>
  <div class="bar"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn ok">${ic("pen")} Assinar</button></div></form>`,
  async f=>{const hash=await sha256(canon(tipo,pac,{...obj,assinatura:undefined}));
    try{const r=await Signer.providers[f.prov].sign(hash,{tipo,pac});obj.assinatura={provider:f.prov,hash,em:new Date().toISOString(),...r};}
    catch(e){toast("Falha na assinatura: "+e.message);return false}
    toast("Documento assinado");if(done)done()});
}
const sigHtml=a=>a?`<div class="sigbox">${ic("lock")} Assinado por ${esc(a.signer)} em ${fdate(a.em)} · ${esc(a.cert||"")}<br>SHA-256: ${a.hash}</div>`:"";

/* =============== modal =============== */
function modal(html,onSubmit,wide){
  const d=$("#dlg");d.className=wide?"wide":"";d.innerHTML=html;if(!d.open)d.showModal();
  d.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>d.close());
  const f=d.querySelector("form");
  if(f)f.onsubmit=async e=>{e.preventDefault();try{const r=await onSubmit(Object.fromEntries(new FormData(f)),f);if(r===false)return;d.close();render()}catch(err){toast("Erro: "+(err.message||err))}};
}
const confirmDlg=(msg,ok)=>modal(`<h3>Confirmar</h3><p>${msg}</p><form><div class="bar"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn danger">Confirmar</button></div></form>`,()=>ok());

/* =============== render =============== */
$("#dlCid").innerHTML=CID.map(([c,d])=>`<option value="${c} – ${d}">`).join("");
$("#dlMed").innerHTML=MEDS.map(m=>`<option value="${m}">`).join("");
$("#dlExame").innerHTML=EXAMES.map(e=>`<option value="${e[0]}">`).join("");

  save();

  const q=$("#q").value.toLowerCase().trim();
  $("#plist").innerHTML=S.pacs.filter(p=>!q||(p.nome+p.cpf+p.cns+p.pront).toLowerCase().includes(q)).map(p=>{
    const last=[...p.aten].sort((a,b)=>b.data.localeCompare(a.data))[0];
    return `<div class="pi ${p.id===S.cur?"on":""}" data-act="sel" data-id="${p.id}">${avatar(p)}<div><b>${esc(p.nome.replace(/\(.*\)/,"").trim())}</b><small>${idade(p.nasc)} anos · ${last?"últ. "+new Date(last.data).toLocaleDateString("pt-BR"):"sem atendimento"}</small></div></div>`}).join("")||'<div style="color:#8ea0bd;padding:8px">Nenhum resultado</div>';
  const p=P();
  $("#ficha").innerHTML=`<div class="card"><div class="phead">${avatar(p)}<div style="flex:1;min-width:240px">
    <h2>${esc(p.nome)} <button class="btn ghost sm" data-act="editPac" title="Editar cadastro">${ic("edit")} Editar</button></h2>
    <div class="meta"><span><b>${p.sexo==="F"?"Feminino":"Masculino"}</b>, ${idade(p.nasc)} anos (${fday(p.nasc)})</span><span>Prontuário <b>${esc(p.pront)}</b></span><span>CNS <b>${esc(p.cns)}</b></span><span>CPF <b>${esc(p.cpf)}</b></span><span>${esc(p.tel)}</span></div>
    <div class="meta"><span>${esc(p.end)}</span><span>${esc(p.equipe)}</span></div>
    ${p.alergias&&!/^nenhuma/i.test(p.alergias)?`<div class="alert">⚠ Alergias: ${esc(p.alergias)}</div>`:`<div class="meta"><span>Alergias: <b>${esc(p.alergias||"não informado")}</b></span></div>`}
  </div></div></div>`;
  $("#tabs").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" data-act="tab" data-id="${t}">${t}</button>`).join("");
  $("#view").innerHTML=({Resumo:vResumo,Atendimentos:vAten,"Evolução":vEvol,"Prescrições":vPresc,Exames:vEx})[tab]();
}

/* ---- resumo ---- */

  <div class="card"><h3>Última prescrição</h3>${lastP?`<table>${lastP.itens.map(i=>`<tr><td><b>${esc(i.med)}</b><br><small style="color:var(--mut)">${esc(i.dose)} · ${esc(i.via)} · ${esc(i.freq)} · ${esc(i.dur)}</small></td></tr>`).join("")}</table><small style="color:var(--mut)">${fdate(lastP.data)} ${lastP.assinatura?"· assinada":"· sem assinatura"}</small>`:'<div class="empty">Sem prescrições</div>'}
  <h3 style="margin-top:18px">Exames pendentes</h3>${pend.length?pend.map(e=>`<div>${esc(e.nome)} <span class="chip ${STCOLOR[e.status]}">${e.status}</span></div>`).join(""):'<div style="color:var(--mut)">Nenhum</div>'}</div></div>`;

/* ---- atendimentos ---- */
const atenHtml=(a,full=true)=>{const v=a.vit||{};const vit=[["PA",v.pa,""],["FC",v.fc,"bpm"],["T",v.temp,"°C"],["Peso",v.peso,"kg"],["SpO₂",v.sat,"%"]].filter(x=>x[1]);
  return `<div class="item"><div class="h"><div><b>${fdate(a.data)}</b> · ${esc(a.carater)} ${a.assinado?'<span class="chip ok">'+ic("lock")+' Assinado</span>':'<span class="chip warn">Rascunho</span>'}</div>
  ${full?`<div class="acts">${a.assinado?"":`<button class="btn sm ok" data-act="signAten" data-id="${a.id}">${ic("pen")} Assinar</button><button class="btn sm ghost" data-act="editAten" data-id="${a.id}">${ic("edit")} Editar</button><button class="btn sm danger" data-act="delAten" data-id="${a.id}">${ic("trash")}</button>`}</div>`:""}</div>
  ${vit.length?`<p style="color:var(--mut)">${vit.map(x=>`${x[0]} <b style="color:var(--ink)">${esc(x[1])}${x[2]}</b>`).join(" · ")}</p>`:""}
  ${["S","O","A","P"].filter(k=>a[k]).map(k=>`<p><b>${{S:"Subjetivo",O:"Objetivo",A:"Avaliação",P:"Plano"}[k]}:</b> ${esc(a[k])}</p>`).join("")}
  ${a.cids.length?`<p>${a.cids.map(c=>`<span class="chip">${esc(c)}</span>`).join(" ")}</p>`:""}
  ${a.proc&&full?`<p style="color:var(--mut)">Procedimento: ${esc(a.proc)}</p>`:""}${a.assinado&&a.assinatura?sigHtml(a.assinatura):""}</div>`};
function vAten(){const p=P();const l=[...p.aten].sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="card"><div class="head"><h3>Atendimentos</h3><button class="btn" data-act="novoAten">${ic("plus")} Novo atendimento</button></div>${l.length?l.map(a=>atenHtml(a)).join(""):'<div class="empty">Nenhum atendimento registrado.</div>'}</div>`}
function vEvol(){const p=P();const l=[...p.aten].sort((a,b)=>b.data.localeCompare(a.data));
  return `<div class="card"><h3>Evolução</h3>${l.length?`<div class="timeline">${l.map(a=>atenHtml(a,false)).join("")}</div>`:'<div class="empty">Sem evolução registrada.</div>'}</div>`}

function formAten(id){
  const ex=id?P().aten.find(a=>a.id===id):null;const cids=[...(ex?.cids||[])];const v=ex?.vit||{};
  modal(`<h3>${ex?"Editar":"Novo"} atendimento</h3><form>
  <div class="row"><div><label>Data/hora</label><div class="row"><input type="datetime-local" name="data" id="dt" value="${ex?.data||nowLocal()}"><button type="button" class="btn ghost sm fix" id="agora">Agora</button></div></div>
  <div><label>Caráter</label><select name="carater">${CARATER.map(c=>`<option ${ex?.carater===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
  <div class="row"><div><label>PA</label><input name="pa" placeholder="120/80" value="${esc(v.pa)}"></div><div><label>FC (bpm)</label><input name="fc" value="${esc(v.fc)}"></div><div><label>Temp (°C)</label><input name="temp" value="${esc(v.temp)}"></div><div><label>Peso (kg)</label><input name="peso" value="${esc(v.peso)}"></div><div><label>SpO₂ (%)</label><input name="sat" value="${esc(v.sat)}"></div></div>
  <label>Subjetivo (queixa, HDA)</label><textarea name="S">${esc(ex?.S)}</textarea>
  <label>Objetivo (exame físico)</label><textarea name="O">${esc(ex?.O)}</textarea>
  <label>Avaliação</label><textarea name="A">${esc(ex?.A)}</textarea>
  <label>Plano / conduta</label><textarea name="P">${esc(ex?.P)}</textarea>
  <label>Diagnósticos (CID-10)</label><div class="row"><input id="cidIn" list="dlCid" placeholder="Buscar CID…"><button type="button" class="btn soft sm fix" id="addCid">Adicionar</button></div>
  <div id="cidList" style="margin-top:8px"></div>
  <label>Procedimento</label><input name="proc" value="${esc(ex?.proc??"Consulta médica (03.01.01.007-2)")}">
  <div class="bar"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar rascunho</button></div></form>`,
  f=>{if(!(f.S||f.O||f.A||f.P)){toast("Preencha ao menos um campo clínico");return false}
    const o={data:f.data,carater:f.carater,vit:{pa:f.pa,fc:f.fc,temp:f.temp,peso:f.peso,sat:f.sat},S:f.S,O:f.O,A:f.A,P:f.P,cids:[...cids],proc:f.proc};

  const draw=()=>$("#cidList").innerHTML=cids.map((c,i)=>`<span class="chip">${esc(c)} <a href="#" data-i="${i}" style="color:inherit;text-decoration:none">✕</a></span> `).join("");draw();

}

  return `<div class="card"><div class="head"><h3>Prescrições</h3><button class="btn" data-act="novaPresc">${ic("plus")} Nova prescrição</button></div>
  ${l.length?l.map(r=>`<div class="item"><div class="h"><div><b>${fdate(r.data)}</b> ${r.assinatura?'<span class="chip ok">'+ic("lock")+' Assinada</span>':'<span class="chip warn">Sem assinatura</span>'}</div>
   <div class="acts">${r.assinatura?"":`<button class="btn sm ok" data-act="signPresc" data-id="${r.id}">${ic("pen")} Assinar</button>`}<button class="btn sm ghost" data-act="printPresc" data-id="${r.id}">${ic("print")} Imprimir</button><button class="btn sm ghost" data-act="repPresc" data-id="${r.id}">${ic("copy")} Repetir</button>${r.assinatura?"":`<button class="btn sm danger" data-act="delPresc" data-id="${r.id}">${ic("trash")}</button>`}</div></div>
   <table>${r.itens.map((i,n)=>`<tr><td style="width:28px;color:var(--mut)">${n+1}.</td><td><b>${esc(i.med)}</b><br><small style="color:var(--mut)">${esc(i.dose)} · ${esc(i.via)} · ${esc(i.freq)} · ${esc(i.dur)}</small></td><td style="text-align:right">${r.assinatura?'<span class="chip ok">'+ic("check")+'</span>':""}</td></tr>`).join("")}</table>${sigHtml(r.assinatura)}</div>`).join(""):'<div class="empty">Nenhuma prescrição.</div>'}</div>`}

function formPresc(base=[]){
  const itens=base.map(i=>({...i}));
  modal(`<h3>Nova prescrição</h3>${P().alergias&&!/^nenhuma/i.test(P().alergias)?`<div class="alert">⚠ Alergias: ${esc(P().alergias)}</div>`:""}
  <form><div class="row"><div style="flex:2"><label>Medicamento</label><input id="m" list="dlMed" placeholder="Digite para buscar"></div><div><label>Dose</label><input id="d" placeholder="1 comprimido"></div></div>
  <div class="row"><div><label>Via</label><select id="v"><option>VO</option><option>IM</option><option>EV</option><option>SC</option><option>Inalatória</option><option>Tópica</option></select></div><div><label>Frequência</label><input id="fq" placeholder="8/8h"></div><div><label>Duração</label><input id="du" placeholder="7 dias"></div><button type="button" class="btn soft fix" id="add">${ic("plus")} Item</button></div>
  <div id="lst" style="margin-top:14px"></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" name="sig"> Assinar ao salvar</label>
  <div class="bar"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar prescrição</button></div></form>`,
  f=>{if(!itens.length){toast("Adicione ao menos um item");return false}
    const r={id:uid(),data:new Date().toISOString(),itens,assinatura:null};P().presc.push(r);tab="Prescrições";toast("Prescrição salva");
    if(f.sig)setTimeout(()=>signDialog("prescricao",r,render),50)},true);
  const draw=()=>$("#lst").innerHTML=itens.length?`<table>${itens.map((i,n)=>`<tr><td><b>${esc(i.med)}</b><br><small style="color:var(--mut)">${esc(i.dose)} · ${esc(i.via)} · ${esc(i.freq)} · ${esc(i.dur)}</small></td><td style="text-align:right"><a href="#" data-n="${n}" style="color:var(--bad)">remover</a></td></tr>`).join("")}</table>`:'<div style="color:var(--mut)">Nenhum item adicionado.</div>';draw();
  $("#add").onclick=()=>{const med=$("#m").value.trim();if(!med)return;
    const al=(P().alergias||"").toLowerCase().split(/[,;]/).map(s=>s.trim().split(" ")[0]).filter(s=>s.length>3&&!s.startsWith("nenhum"));
    if(al.some(a=>med.toLowerCase().includes(a))&&!window.confirm("Possível conflito com alergia registrada. Adicionar mesmo assim?"))return;
    itens.push({med,dose:$("#d").value,via:$("#v").value,freq:$("#fq").value,dur:$("#du").value||"uso contínuo"});["m","d","fq","du"].forEach(i=>$("#"+i).value="");draw();$("#m").focus()};
  $("#lst").onclick=e=>{e.preventDefault();if(e.target.dataset.n){itens.splice(+e.target.dataset.n,1);draw()}};
}

  ${l.length?l.map(e=>`<div class="item"><div class="h"><div><b>${esc(e.nome)}</b> <span class="chip">${e.tipo}</span> <small style="color:var(--mut)">${fdate(e.data)}</small></div>
   <div class="acts"><select data-act="stEx" data-id="${e.id}" style="width:auto;padding:4px 8px">${STATUS_EX.map(s=>`<option ${s===e.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn sm soft" data-act="upEx" data-id="${e.id}">${ic("clip")} Anexar</button><button class="btn sm danger" data-act="delEx" data-id="${e.id}">${ic("trash")}</button></div></div>

function formAvulso(){
  modal(`<h3>Anexar resultado de exame</h3><p style="color:var(--mut);margin:0">Guarda PDF/imagem de um exame já realizado.</p><form>
  <label>Nome do exame</label><input name="nome" list="dlExame" required><div class="row"><div><label>Data de realização</label><input type="date" name="dia" value="${nowLocal().slice(0,10)}"></div><div><label>Tipo</label><select name="tipo"><option>Laboratorial</option><option>Imagem</option></select></div></div>

async function addFile(fl){const id=uid();await fPut(id,fl);return{id,nome:fl.name,size:fl.size,mime:fl.type}}
async function getUrl(id){const b=await fGet(id);return b?URL.createObjectURL(b):null}

/* =============== impressão =============== */
function imprimir(tipo,id){
  const p=P();const cab=`<h2>${tipo==="presc"?"Receituário":"Solicitação de exames"}</h2><div>${$("#unidade").value}</div><p><b>${esc(p.nome)}</b> · ${idade(p.nasc)} anos · CNS ${esc(p.cns)} · CPF ${esc(p.cpf)}</p><hr>`;
  let corpo,ass="";
  if(tipo==="presc"){const r=p.presc.find(x=>x.id===id);corpo=`<ol>${r.itens.map(i=>`<li style="margin-bottom:10px"><b>${esc(i.med)}</b><br>${esc(i.dose)} · ${esc(i.via)} · ${esc(i.freq)} · ${esc(i.dur)}</li>`).join("")}</ol><p>${fdate(r.data)}</p>`;
    if(r.assinatura)ass=`Assinado eletronicamente por ${esc(r.assinatura.signer)} em ${fdate(r.assinatura.em)}<br>Certificado: ${esc(r.assinatura.cert||"")}<br>SHA-256: ${r.assinatura.hash}`}
  else{const l=p.exames.filter(e=>e.status==="Solicitado");if(!l.length){toast("Não há exames com status “Solicitado”");return}
    corpo=`<ul>${l.map(e=>`<li>${esc(e.nome)} <small>(${e.tipo})</small></li>`).join("")}</ul><p><b>Indicação:</b> ${esc([...new Set(l.map(e=>e.ind))].join("; "))}</p><p>${fdate(new Date().toISOString())}</p>`}
  $("#print").innerHTML=cab+corpo+`<div class="sig">${ass||"Dr(a). Fernando – CRM/SP 000000 (fictício) – sem assinatura eletrônica"}</div>`;
  window.print();
}

/* =============== ações (delegação) =============== */
function formPac(id){
  const ex=id?S.pacs.find(p=>p.id===id):{};const F=(n,l,t="text",x="")=>`<div><label>${l}</label><input type="${t}" name="${n}" value="${esc(ex[n]??"")}" ${x}></div>`;
  modal(`<h3>${id?"Editar cadastro":"Novo paciente"}</h3><p style="color:var(--mut);margin:0">Use apenas dados fictícios.</p><form>
  <div class="row">${F("nome","Nome completo","text","required")}${F("social","Nome social")}</div>
  <div class="row"><div><label>Sexo</label><select name="sexo"><option value="F" ${ex.sexo==="F"?"selected":""}>Feminino</option><option value="M" ${ex.sexo==="M"?"selected":""}>Masculino</option></select></div>${F("nasc","Nascimento","date","required")}${F("raca","Raça/cor")}</div>
  <div class="row">${F("cns","CNS")}${F("cpf","CPF")}${F("tel","Telefone")}</div>${F("end","Endereço")}${F("equipe","Equipe / INE")}${F("alergias","Alergias")}
  <div class="bar"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Salvar</button></div></form>`,
  f=>{if(id)Object.assign(ex,f);else{const n=uid();S.pacs.push({id:n,pront:String(10001+S.pacs.length),aten:[],presc:[],exames:[],alergias:"Nenhuma conhecida",...f});S.cur=n;tab="Resumo"}toast("Cadastro salvo")},true);
}
async function removeAllFiles(list){for(const e of list)for(const a of e.anexos||[])await fDel(a.id)}
const A={
  sel(id){S.cur=id;render()},tab(id){tab=id;render()},
  editPac(){formPac(S.cur)},
  novoAten(){formAten()},editAten(id){formAten(id)},
  signAten(id){const a=P().aten.find(x=>x.id===id);signDialog("atendimento",a,()=>{a.assinado=true;a.assinadoEm=a.assinatura.em;render()})},
  delAten(id){confirmDlg("Excluir este rascunho de atendimento?",()=>{P().aten=P().aten.filter(a=>a.id!==id)})},
  novaPresc(){formPresc()},
  repPresc(id){formPresc(P().presc.find(r=>r.id===id).itens)},
  signPresc(id){const r=P().presc.find(x=>x.id===id);signDialog("prescricao",r,render)},
  printPresc(id){imprimir("presc",id)},
  delPresc(id){confirmDlg("Excluir esta prescrição?",()=>{P().presc=P().presc.filter(r=>r.id!==id)})},
  novoEx(){formEx()},anexoAvulso(){formAvulso()},printEx(){imprimir("ex")},
  delEx(id){confirmDlg("Excluir este exame e seus arquivos?",async()=>{const e=P().exames.find(x=>x.id===id);await removeAllFiles([e]);P().exames=P().exames.filter(x=>x.id!==id)})},
  upEx(id){const u=$("#upFile");u.value="";u.onchange=async()=>{const e=P().exames.find(x=>x.id===id);for(const f of u.files)(e.anexos=e.anexos||[]).push(await addFile(f));if(e.status==="Solicitado"||e.status==="Coletado"||e.status==="Em análise")e.status="Resultado";toast("Arquivo guardado");render()};u.click()},
  async openF(id){const u=await getUrl(id);u?window.open(u,"_blank"):toast("Arquivo não encontrado")},
  async dlF(id,el){const u=await getUrl(id);if(!u)return toast("Arquivo não encontrado");const a=document.createElement("a");a.href=u;a.download=el.dataset.n;a.click()},
  delF(id,el){confirmDlg("Remover este arquivo?",async()=>{const e=P().exames.find(x=>x.id===id);await fDel(el.dataset.f);e.anexos=e.anexos.filter(a=>a.id!==el.dataset.f)})}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.tagName==="SELECT"||t.tagName==="INPUT")return;e.preventDefault();A[t.dataset.act]?.(t.dataset.id,t)});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="fx"){filtroEx=t.value;render();return}
  if(t.dataset.act==="stEx"){P().exames.find(x=>x.id===t.dataset.id).status=t.value;render()}
  if(t.dataset.act==="resEx"){const x=P().exames.find(x=>x.id===t.dataset.id);x.res=t.value;if(t.value&&x.status==="Solicitado")x.status="Resultado";render()}});
$("#novoPac").onclick=()=>formPac();
$("#q").oninput=render;
$("#reset").onclick=()=>confirmDlg("Restaurar dados de demonstração? Todos os pacientes e arquivos serão apagados.",async()=>{const db=await DB;db.transaction("f","readwrite").objectStore("f").clear();S=seed();tab="Resumo"});

/* backup */
$("#exp").onclick=async()=>{const files={};for(const p of S.pacs)for(const e of p.exames)for(const a of e.anexos||[]){const b=await fGet(a.id);if(b)files[a.id]=await b64(b)}
  const blob=new Blob([JSON.stringify({versao:1,exportadoEm:new Date().toISOString(),S,files})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup-pep-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Backup exportado")};
$("#imp").onclick=()=>$("#impFile").click();
$("#impFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.S?.pacs)throw 0;
    confirmDlg("Importar substitui todos os dados atuais. Continuar?",async()=>{for(const [id,u] of Object.entries(d.files||{}))await fPut(id,await (await fetch(u)).blob());S=d.S;tab="Resumo";toast("Backup importado")})}
  catch{toast("Arquivo de backup inválido")}e.target.value=""};
/* =============== login (Supabase) e inicialização =============== */
const cred=()=>({email:$("#aEmail").value.trim(),password:$("#aPass").value});
async function enter(user){UID=user.id;$("#auth").style.display="none";$("#out").style.display="";try{await loadRemote()}catch(e){toast("Erro ao carregar: "+(e.message||e))}render()}
$("#aForm").onsubmit=async e=>{e.preventDefault();const {data,error}=await sb.auth.signInWithPassword(cred());if(error)return void($("#aMsg").textContent=error.message);enter(data.user)};
$("#aSign").onclick=async()=>{const {data,error}=await sb.auth.signUp(cred());if(error)return void($("#aMsg").textContent=error.message);if(data.session)enter(data.user);else $("#aMsg").textContent="Conta criada. Confirme o e-mail e depois entre."};
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};
(async function boot(){
  if(!SB_ON){if(SUPABASE_URL&&!window.supabase)toast("Supabase não carregou; usando armazenamento local");render();return}
  $("#reset").style.display="none";
  const {data}=await sb.auth.getSession();
  if(data.session)enter(data.session.user);else $("#auth").style.display="grid";
})();
</script>
