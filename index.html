<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1b2d">
<title>PEP – Prontuário Eletrônico</title>
<style>
:root{
  color-scheme:dark;
  --bg:#f5f7fb;--panel:#fff;--side:#0f1b2d;--side2:#18283f;--ink:#152033;--mut:#6b7a90;--line:#e5eaf2;
  --pri:#2563eb;--pri-soft:#e8efff;--ok:#12805c;--ok-soft:#dcf5ea;--warn:#a85a00;--warn-soft:#fff0d6;--bad:#c62828;--bad-soft:#fde4e4;
  --r:14px;--sh:0 1px 2px #0b1a3012,0 4px 16px #0b1a300a
}
/* tema escuro fixo, independente do modo do aparelho */
:root{
  --bg:#0b1220;--panel:#141d2e;--side:#0e1729;--side2:#17233a;--ink:#e6ecf5;--mut:#8b9bb3;--line:#223049;
  --pri:#5b8cff;--pri-soft:#1b2a4d;--ok:#4cd2a1;--ok-soft:#10372c;--warn:#ffbf5c;--warn-soft:#3b2a0c;--bad:#ff7b7b;--bad-soft:#3d1717;--sh:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100%}
/* sidebar */
aside{background:var(--side);color:#cfd9ea;border-right:1px solid #ffffff12;padding:20px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#22d3ee);display:grid;place-items:center;color:#fff}
.search{position:relative}
.search input{width:100%;background:var(--side2);border:1px solid #243551;color:#fff;border-radius:10px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:11px;color:#7c8ba3}
.plist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px}
.pi{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.pi:hover{background:var(--side2)}.pi.on{background:#1d3157;border-color:#2c4a80}
.pi b{display:block;color:#fff;font-weight:600;font-size:13.5px}.pi small{color:#8ea0bd}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.sidefoot{display:grid;gap:6px}
/* main */
main{padding:28px 32px 64px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .who{color:var(--mut)}.top select{width:auto}
.demo{background:var(--warn-soft);color:var(--warn);padding:6px 12px;border-radius:10px;font-size:12px}
.sv{border:0;background:var(--ok-soft);color:var(--ok);padding:5px 12px;border-radius:99px;font:600 12px/1.4 inherit;cursor:default}
.sv.warn{background:var(--warn-soft);color:var(--warn)}.sv.bad{background:var(--bad-soft);color:var(--bad);cursor:pointer}
[tabindex]:focus-visible,button:focus-visible,a:focus-visible,.pi:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.pi{cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:20px}
.card h3{margin:0 0 14px;font-size:16px;letter-spacing:-.01em}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}.qa .btn{justify-content:center}
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phead .av{width:64px;height:64px;font-size:22px}
.phead h2{margin:0;font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
.alert{margin-top:10px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 12px;display:inline-block;font-weight:600}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:9px;cursor:pointer;font:inherit;font-weight:500}
.tabs button.on{background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat b{font-size:26px;display:block}.stat span{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
/* controls */
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--pri);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
aside .btn.ghost{color:#e6ecf5;background:#ffffff0f;border-color:#34476b}
aside .btn.ghost:hover{background:#ffffff1c}
.tabs svg{display:none}
#mbar,#scrim,#menuClose{display:none}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--panel);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:110px}.row>.fix{flex:none;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h3{margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pri-soft);color:var(--pri)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.item .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.item p{margin:3px 0;white-space:pre-wrap}.item .acts{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--mut);padding:28px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
.timeline .item{position:relative}.timeline .item:before{content:"";position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:3px solid var(--bg)}
.file{display:inline-flex;gap:6px;align-items:center;background:var(--pri-soft);color:var(--pri);border-radius:8px;padding:3px 8px;font-size:12.5px;margin:2px 4px 2px 0}
.file a{color:inherit;text-decoration:none;cursor:pointer}
.sigbox{margin-top:8px;font-size:12px;color:var(--ok);background:var(--ok-soft);padding:6px 10px;border-radius:8px;word-break:break-all}
/* dialog */
dialog{border:0;border-radius:18px;padding:22px;width:min(680px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0007}
dialog.wide{width:min(820px,95vw)}
dialog::backdrop{background:#0a122399;backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:18px}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1}
#print{display:none}
#auth{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);place-items:center;padding:16px}
#auth form{width:min(400px,100%);margin:0}
@media (max-width:860px){
  body{font-size:15px}
  .app{display:block}
  /* barra superior + menu lateral deslizante (em vez de empilhar a barra lateral no topo) */
  #mbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--side);color:#fff}
  #mbar .pn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
  #mbar .pn small{color:#9fb0cb;font-size:11.5px}
  #mbar .pn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mbar button,#menuClose{background:#ffffff1a;border:0;color:#fff;border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
  #menuClose{display:grid;margin-left:auto}
  aside{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);height:100dvh;z-index:60;transform:translateX(-105%);transition:transform .25s;overflow:auto;padding-top:calc(18px + env(safe-area-inset-top))}
  body.menu aside{transform:none;box-shadow:0 0 40px #0008}
  #scrim{display:block;position:fixed;inset:0;background:#0009;z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
  body.menu #scrim{opacity:1;pointer-events:auto}
  main{padding:14px 14px 100px}
  .top{flex-direction:column;align-items:stretch;gap:8px;margin-bottom:12px}.top .btn,.top .sv{align-self:flex-start}.top .who{display:none}
  .demo{font-size:11.5px;padding:5px 10px}
  .card{padding:14px;margin-bottom:12px}
  .phead{gap:12px}.phead .av{width:48px;height:48px;font-size:17px}.phead h2{font-size:18px;line-height:1.25}
  .meta{gap:4px 14px;font-size:13px}
  .two{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.stat{padding:12px 14px}.stat b{font-size:22px}.stat span{font-size:13px}
  .qa{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.qa .btn{padding:10px 8px;font-size:13.5px}
  .card h3{font-size:15.5px}.head{margin-bottom:12px}.item{padding:14px}
  /* abas viram barra de navegação inferior */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;border-radius:10px}
  .tabs svg{display:block;width:21px;height:21px}
  input,select,textarea{font-size:16px}
  .btn{min-height:42px;padding:9px 14px}.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
  .item .acts{width:100%}
  dialog,dialog.wide{width:100vw;max-width:100vw;margin:auto 0 0;max-height:94dvh;border-radius:20px 20px 0 0;padding:18px}
  #toast{bottom:90px;width:max-content;max-width:90vw}
}
@media print{
  body{background:#fff;color:#000}.app,dialog,#toast,#mbar,#scrim,#auth,#sv{display:none!important}
  #print{display:block;font:14px/1.5 Georgia,serif;padding:10mm}
  #print h2{margin:0 0 4px}#print hr{margin:10px 0}#print .sig{margin-top:40px;font:11px/1.4 monospace;border-top:1px solid #000;padding-top:6px;word-break:break-all}
}
</style>
</head>
<body>
<div id="mbar"><button id="menuBtn" aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="pn"><small>Paciente</small><b id="pname">—</b></div></div>
<div id="scrim"></div>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 5v14M5 12h14"/></svg></div>PEP Clínico<button id="menuClose" aria-label="Fechar menu"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar paciente, CPF, CNS…"></div>
    <button class="btn" id="novoPac"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Novo paciente</button>
    <div class="plist" id="plist"></div>
    <div class="sidefoot">
      <button class="btn ghost sm" id="exp"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg> Exportar backup</button>
      <button class="btn ghost sm" id="imp"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4M4 21h16"/></svg> Importar backup</button>
      <button class="btn ghost sm" data-act="prof">Dados do profissional</button>
      <button class="btn ghost sm" id="reset">Resetar demo</button>
      <button class="btn ghost sm" id="out" style="display:none">Sair da conta</button>
      <input type="file" id="impFile" accept=".json" hidden>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="btn ghost sm unid" id="unid" data-act="prof" title="Dados do profissional e da unidade">Definir unidade</button>
      <div class="demo">Protótipo com dados fictícios · não usar com pacientes reais</div>
      <button class="sv" id="sv" type="button" title="Estado da gravação" data-act="sync"></button>
      <div class="who"></div>
    </div>
    <div id="ficha"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="view"></div>
  </main>
</div>
<div id="print"></div>
<div id="auth"><form id="aForm" class="card"><h3 style="font-size:20px">Entrar no PEP</h3><p style="color:var(--mut);margin:0">Acesso restrito. Seus dados ficam na sua conta.</p>
  <label for="aEmail">E-mail</label><input id="aEmail" type="email" required autocomplete="username"><label for="aPass">Senha</label><input id="aPass" type="password" required minlength="8" autocomplete="current-password">
  <div id="aMsg" style="color:var(--bad);min-height:20px;margin-top:8px"></div>
  <div class="bar"><button class="btn">Entrar</button></div></form></div>
<dialog id="dlg"></dialog>
<dialog id="dlgC"></dialog>
<script src="vendor/supabase.js"></script>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="upFile" accept=".pdf,.png,.jpg,.jpeg,.webp" multiple hidden>
<datalist id="dlCid"></datalist><datalist id="dlMed"></datalist><datalist id="dlExame"></datalist>

<script src="app.js"></script>
</body>
</html>
