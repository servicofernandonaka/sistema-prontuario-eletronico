<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEP Clínico</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#111c2e; --panel-2:#16233a; --card:#152238; --line:#243246;
    --fg:#e8eef6; --muted:#8aa0bb; --brand:#3b82f6; --brand-600:#2f6fe0; --brand-050:#16233a;
    --ok:#22c55e; --err:#ef4444; --warn-bg:#3a2f12; --warn-br:#6b5718; --warn-fg:#e6c24a;
    --s:#ec6a93; --s-bg:#2a1620; --o:#4a95e6; --o-bg:#11243a; --a:#d7a641; --a-bg:#2a2412; --p:#39c08a; --p-bg:#10271d;
    --radius:12px; --font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
  h1,h2,h3{margin:0}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  .hidden{display:none!important}

  /* inputs */
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;letter-spacing:.01em}
  .inp,input.f,select.f,textarea.f{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);
    border-radius:9px;padding:10px 12px;font-size:14px;outline:0}
  .inp:focus,input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
  textarea.f{min-height:80px;resize:vertical}
  .field{margin-bottom:12px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:9px;
    padding:10px 15px;font-size:14px;font-weight:600;background:var(--panel-2);color:var(--fg)}
  .btn:hover{background:#1b2c47}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand-600)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
  .btn.sm{padding:7px 11px;font-size:13px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- LOGIN ---------- */
  #view-login{min-height:100%;display:grid;place-items:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
  .login-card h1{font-size:22px;margin-bottom:4px}
  .login-card p{color:var(--muted);font-size:13.5px;margin:0 0 18px}

  /* ---------- APP SHELL ---------- */
  #view-app{display:flex;min-height:100%}
  .sidebar{flex:0 0 268px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:16px 14px;gap:12px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 6px}
  .logo .tile{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .search-box svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
  .search-box input{border:0;background:transparent;color:var(--fg);outline:0;width:100%;font-size:14px}
  .side-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:2px -4px}
  .side-item{text-align:left;border:0;background:transparent;color:var(--fg);border-radius:9px;padding:10px 10px;display:flex;flex-direction:column;gap:1px}
  .side-item:hover{background:var(--panel-2)}
  .side-item.active{background:var(--brand-050);box-shadow:inset 0 0 0 1px var(--line)}
  .side-item .nm{font-size:14px;font-weight:600}
  .side-item .mt{font-size:11.5px;color:var(--muted)}
  .side-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .side-foot .btn{justify-content:flex-start}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line)}
  .badge-proto{background:var(--warn-bg);border:1px solid var(--warn-br);color:var(--warn-fg);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px}
  .who{font-size:13px;color:var(--muted)}
  .who b{color:var(--fg)}
  .content{flex:1;padding:22px;overflow:auto}
  .maxw{max-width:1080px;margin:0 auto}

  .empty{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:40px;text-align:center;color:var(--muted)}

  /* patient header */
  .phead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
  .avatar{width:48px;height:48px;border-radius:50%;background:var(--brand-050);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
  .phead .nm{font-size:18px;font-weight:700}
  .phead .mt{font-size:12.5px;color:var(--muted)}
  .phead .sp{flex:1}

  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:4px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .atd-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .atd-row:last-child{border-bottom:0}
  .atd-row .dt{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 150px}
  .atd-row .tp{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--brand-050);color:var(--brand);border:1px solid var(--line)}

  /* SOAP editor */
  .soap{display:flex;flex-direction:column;gap:14px}
  .sbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .sbox .h{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;font-size:15px}
  .sbox .bd{padding:14px 16px}
  .bdg{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;color:#06101f}
  .sbox.s .h{background:var(--s-bg)} .sbox.s .bdg{background:var(--s)}
  .sbox.o .h{background:var(--o-bg)} .sbox.o .bdg{background:var(--o)}
  .sbox.a .h{background:var(--a-bg)} .sbox.a .bdg{background:var(--a)}
  .sbox.p .h{background:var(--p-bg)} .sbox.p .bdg{background:var(--p)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .rm{color:var(--err);border:0;background:transparent;font-size:16px}
  .muted{color:var(--muted);font-size:12.5px}

  /* typeahead */
  .ta{position:relative}
  .ta-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:9px;max-height:240px;overflow:auto;z-index:5;display:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .ta-list.open{display:block}
  .ta-opt{padding:9px 12px;border-bottom:1px solid var(--line)}
  .ta-opt:last-child{border-bottom:0}
  .ta-opt:hover{background:var(--panel-2)}
  .ta-opt .t{font-weight:600;font-size:13.5px}
  .ta-opt .c{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chipx{display:inline-flex;align-items:center;gap:7px;background:var(--brand-050);color:var(--brand);border:1px solid var(--line);border-radius:20px;padding:4px 7px 4px 11px;font-size:12.5px;font-weight:600}
  .chipx button{border:0;background:transparent;color:var(--brand);font-size:14px}

  /* tabs do plano */
  .ptabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .ptab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}
  .ptab.active{background:var(--brand-050);color:var(--fg)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(2,8,18,.66);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;margin:auto;overflow:hidden}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
  .modal .mb{padding:18px 20px}
  .modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
  .x{border:1px solid var(--line);background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b1220;border:1px solid var(--line);color:var(--fg);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--err);color:#ffb4ac}
  .cfg{background:var(--warn-bg);border:1px solid var(--warn-br);color:var(--warn-fg);padding:11px 13px;border-radius:9px;font-size:13px;margin-bottom:14px}

  @media (max-width:760px){
    .sidebar{position:fixed;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5)}
    .sidebar.open{transform:none}
    .menu-btn{display:inline-flex!important}
  }
  .menu-btn{display:none;border:1px solid var(--line);background:transparent;color:var(--fg);width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="view-login" class="hidden">
  <div class="login-card">
    <h1>Entrar no PEP</h1>
    <p>Acesso restrito. Seus dados ficam na sua conta.</p>
    <div id="cfg" class="cfg hidden"></div>
    <div class="field"><label>E-mail</label><input id="li-email" class="f" type="email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="li-pass" class="f" type="password" autocomplete="current-password"></div>
    <button id="li-btn" class="btn primary block">Entrar</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="view-app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="tile">+</span> PEP Clínico</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="pac-search" placeholder="Buscar paciente, CPF, CNS…" autocomplete="off">
    </div>
    <button class="btn primary block" id="btn-novo-pac">+ Novo paciente</button>
    <div class="side-list" id="pac-list"></div>
    <div class="side-foot">
      <button class="btn ghost" id="btn-logout">Sair da conta</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <span class="badge-proto">Protótipo · dados fictícios · não usar com pacientes reais</span>
      <span class="who" id="who"></span>
    </div>
    <div class="content"><div class="maxw" id="main-content"></div></div>
  </main>
</div>

<!-- ======= MODAL: Novo paciente ======= -->
<div class="overlay" id="m-pac"><div class="modal">
  <div class="mh"><span>Novo paciente</span><button class="x" data-close>✕</button></div>
  <div class="mb">
    <div class="grid">
      <div class="field" style="grid-column:1/-1"><label>Nome completo *</label><input id="np-nome" class="f" placeholder="Nome do paciente"></div>
      <div class="field"><label>CPF</label><input id="np-cpf" class="f" placeholder="000.000.000-00"></div>
      <div class="field"><label>CNS (Cartão SUS)</label><input id="np-cns" class="f" placeholder="000 0000 0000 0000"></div>
      <div class="field"><label>Data de nascimento</label><input id="np-nasc" class="f" type="date"></div>
      <div class="field"><label>Sexo</label><select id="np-sexo" class="f"><option value="">—</option><option>Feminino</option><option>Masculino</option></select></div>
      <div class="field"><label>Nome da mãe</label><input id="np-mae" class="f"></div>
      <div class="field"><label>Telefone</label><input id="np-tel" class="f" placeholder="(11) 90000-0000"></div>
    </div>
  </div>
  <div class="mf"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="np-save">Salvar paciente</button></div>
</div></div>

<!-- ======= MODAL: Exame ======= -->
<div class="overlay" id="m-exam"><div class="modal">
  <div class="mh"><span>Solicitar exame</span><button class="x" data-close>✕</button></div>
  <div class="mb">
    <div class="field"><label>Exames (busca na SIGTAP)</label>
      <div class="ta"><input id="ex-search" class="f" placeholder="Digite: hemo, glicose, tsh, ultrassom…" autocomplete="off"><div class="ta-list" id="ex-list"></div></div>
      <div class="chips" id="ex-chips"></div>
    </div>
    <div class="field"><label>CID 10 (opcional)</label><input id="ex-cid" class="f" placeholder="Ex.: E11"></div>
    <div class="field"><label>Justificativa</label><textarea id="ex-just" class="f" placeholder="Justificativa do procedimento"></textarea></div>
  </div>
  <div class="mf"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="ex-add">Adicionar ao atendimento</button></div>
</div></div>

<!-- ======= MODAL: Prescrição ======= -->
<div class="overlay" id="m-presc"><div class="modal">
  <div class="mh"><span>Prescrição de medicamento</span><button class="x" data-close>✕</button></div>
  <div class="mb">
    <div class="field"><label>Medicamento *</label><input id="pr-med" class="f" placeholder="Ex.: Losartana 50 mg"></div>
    <div class="grid">
      <div class="field"><label>Via</label><select id="pr-via" class="f"><option>Via oral</option><option>Sublingual</option><option>Intramuscular</option><option>Endovenosa</option><option>Tópica</option><option>Inalatória</option></select></div>
      <div class="field"><label>Dose</label><input id="pr-dose" class="f" placeholder="1 comprimido"></div>
      <div class="field"><label>Frequência</label><input id="pr-freq" class="f" placeholder="12/12h"></div>
      <div class="field"><label>Duração</label><input id="pr-dur" class="f" placeholder="30 dias"></div>
      <div class="field"><label>Quantidade</label><input id="pr-qtd" class="f" placeholder="60"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:500"><input type="checkbox" id="pr-cont" style="width:auto"> Uso contínuo</label>
  </div>
  <div class="mf"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="pr-add">Adicionar à prescrição</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG =====================
const SUPABASE_URL = "https://joygodczajayygjxerno.supabase.co";
// Publishable key (formato novo) — pública/segura no front-end; o RLS protege os dados.
const SUPABASE_ANON_KEY = "sb_publishable_kk6ty_YczpR02xLJouj8EA_-oRjTsT6";
// ==================================================

const $ = id => document.getElementById(id);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const toast=(m,err=false)=>{const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2800);};
function idade(d){ if(!d) return ''; const b=new Date(d), n=new Date(); let a=n.getFullYear()-b.getFullYear(); const mm=n.getMonth()-b.getMonth(); if(mm<0||(mm===0&&n.getDate()<b.getDate()))a--; return a+' anos'; }
function dataBR(s){ if(!s) return ''; const d=new Date(s); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

let sb=null, pacientes=[], pacienteSel=null, atendAtual=null;
const examItens=[], prescItens=[];

// ---------- boot/auth ----------
function show(v){ $('view-login').classList.toggle('hidden', v!=='login'); $('view-app').classList.toggle('hidden', v!=='app'); }
function boot(){
  if(!window.supabase||!window.supabase.createClient){ show('login'); toast('Falha ao carregar o Supabase',true); return; }
  if(!SUPABASE_ANON_KEY||SUPABASE_ANON_KEY.startsWith('COLE_')){ show('login'); $('cfg').classList.remove('hidden'); $('cfg').textContent='Configure SUPABASE_URL e SUPABASE_ANON_KEY.'; $('li-btn').disabled=true; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=> data.session?enter(data.session):show('login'));
  sb.auth.onAuthStateChange((_e,s)=> s?enter(s):show('login'));
}
async function enter(session){ $('who').innerHTML='<b>'+esc(session.user.email||'Profissional')+'</b> · Clínica Médica'; show('app'); await carregarPacientes(); renderMain(); }
$('li-btn').onclick=async()=>{ const {error}=await sb.auth.signInWithPassword({email:$('li-email').value.trim(),password:$('li-pass').value}); if(error) toast(error.message,true); };
$('li-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('li-btn').click(); });
$('btn-logout').onclick=()=>{ pacienteSel=null; sb.auth.signOut(); };

// ---------- pacientes ----------
async function carregarPacientes(q){
  let query = sb.from('pep_pacientes').select('id,nome,cpf,cns,data_nascimento,sexo,nome_mae,telefone').order('nome',{ascending:true}).limit(200);
  if(q) query = query.ilike('nome','%'+q+'%');
  const {data,error}=await query;
  if(error){ toast('Erro ao carregar pacientes: '+error.message,true); pacientes=[]; } else pacientes=data||[];
  renderSideList();
}
function renderSideList(){
  const box=$('pac-list'); box.innerHTML='';
  if(!pacientes.length){ box.appendChild(el('div','muted','<div style="padding:10px">Nenhum paciente.</div>')); return; }
  pacientes.forEach(p=>{
    const b=el('button','side-item'+(pacienteSel&&pacienteSel.id===p.id?' active':''));
    b.innerHTML='<span class="nm">'+esc(p.nome||'(sem nome)')+'</span><span class="mt">'+[idade(p.data_nascimento),p.cpf].filter(Boolean).map(esc).join(' · ')+'</span>';
    b.onclick=()=>{ pacienteSel=p; atendAtual=null; $('sidebar').classList.remove('open'); renderSideList(); renderMain(); };
    box.appendChild(b);
  });
}
let searchTimer;
$('pac-search').addEventListener('input',e=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>carregarPacientes(e.target.value.trim()),250); });

// Novo paciente
$('btn-novo-pac').onclick=()=> openM('m-pac');
$('np-save').onclick=async()=>{
  const nome=$('np-nome').value.trim(); if(!nome){ toast('Informe o nome',true); return; }
  const rec={ nome, cpf:$('np-cpf').value.trim()||null, cns:$('np-cns').value.trim()||null,
    data_nascimento:$('np-nasc').value||null, sexo:$('np-sexo').value||null, nome_mae:$('np-mae').value.trim()||null, telefone:$('np-tel').value.trim()||null };
  const {data,error}=await sb.from('pep_pacientes').insert(rec).select().single();
  if(error){ toast('Erro ao salvar: '+error.message,true); return; }
  ['np-nome','np-cpf','np-cns','np-nasc','np-mae','np-tel'].forEach(i=>$(i).value=''); $('np-sexo').value='';
  closeM('m-pac'); toast('Paciente cadastrado ✓');
  await carregarPacientes(); pacienteSel=data; atendAtual=null; renderSideList(); renderMain();
};

// ---------- render principal ----------
function renderMain(){
  const c=$('main-content'); c.innerHTML='';
  if(!pacienteSel){ c.appendChild(el('div','empty','Selecione um paciente na lista, ou clique em <b>+ Novo paciente</b>.')); return; }
  if(atendAtual){ renderAtendimento(c); return; }
  renderFichaPaciente(c);
}

async function renderFichaPaciente(c){
  const p=pacienteSel;
  const head=el('div','phead');
  const ini=(p.nome||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
  head.innerHTML='<div class="avatar">'+esc(ini)+'</div><div><div class="nm">'+esc(p.nome)+'</div>'+
    '<div class="mt">'+[p.sexo,idade(p.data_nascimento),p.cpf?('CPF '+esc(p.cpf)):''].filter(Boolean).map(esc).join(' · ')+'</div></div>'+
    '<div class="sp"></div>';
  const bNovo=el('button','btn primary','+ Novo atendimento'); bNovo.onclick=novoAtendimento; head.appendChild(bNovo);
  c.appendChild(head);

  c.appendChild(el('div','sec-title','Atendimentos'));
  const card=el('div','card'); c.appendChild(card);
  const {data,error}=await sb.from('pep_atendimentos').select('id,data_atendimento,tipo_atendimento,subjetivo').eq('paciente_id',p.id).order('data_atendimento',{ascending:false});
  if(error){ card.appendChild(el('div','',' <div style="padding:16px" class="muted">Erro: '+esc(error.message)+'</div>')); return; }
  if(!data||!data.length){ card.appendChild(el('div','',' <div style="padding:22px;text-align:center" class="muted">Nenhum atendimento ainda.</div>')); return; }
  const tipos={no_dia:'Consulta no dia',agendada:'Consulta agendada',cuidado_continuado:'Cuidado continuado',urgencia:'Urgência'};
  data.forEach(a=>{
    const r=el('div','atd-row');
    r.innerHTML='<span class="dt">'+esc(dataBR(a.data_atendimento))+'</span><span class="tp">'+esc((a.subjetivo||'').slice(0,90)||'—')+'</span><span class="chip">'+esc(tipos[a.tipo_atendimento]||a.tipo_atendimento||'')+'</span>';
    card.appendChild(r);
  });
}

// ---------- atendimento (SOAP) ----------
function novoAtendimento(){ atendAtual={novo:true}; examItens.length=0; prescItens.length=0; renderMain(); }
function renderAtendimento(c){
  const p=pacienteSel;
  const head=el('div','phead');
  head.innerHTML='<div><div class="nm">'+esc(p.nome)+'</div><div class="mt">Novo atendimento · '+[p.sexo,idade(p.data_nascimento)].filter(Boolean).map(esc).join(' · ')+'</div></div><div class="sp"></div>';
  const bVolta=el('button','btn ghost','← Voltar'); bVolta.onclick=()=>{ atendAtual=null; renderMain(); }; head.appendChild(bVolta);
  c.appendChild(head);

  c.insertAdjacentHTML('beforeend', `
   <div class="soap">
    <div class="sbox"><div class="h">Tipo de atendimento</div><div class="bd">
      <select id="f-tipo" class="f" style="max-width:280px">
        <option value="no_dia">Consulta no dia</option><option value="agendada">Consulta agendada</option>
        <option value="cuidado_continuado">Cuidado continuado</option><option value="urgencia">Urgência</option>
      </select></div></div>

    <div class="sbox s"><div class="h"><span class="bdg">S</span> Subjetivo</div><div class="bd">
      <textarea id="f-s" class="f" placeholder="Queixa e história do paciente…"></textarea></div></div>

    <div class="sbox o"><div class="h"><span class="bdg">O</span> Objetivo</div><div class="bd">
      <div class="field"><textarea id="f-o" class="f" placeholder="Exame físico…"></textarea></div>
      <div class="grid">
        <div class="field"><label>PA sistólica</label><input id="f-pas" class="f" type="number" placeholder="120"></div>
        <div class="field"><label>PA diastólica</label><input id="f-pad" class="f" type="number" placeholder="80"></div>
        <div class="field"><label>FC (bpm)</label><input id="f-fc" class="f" type="number" placeholder="72"></div>
        <div class="field"><label>Peso (kg)</label><input id="f-peso" class="f" type="number" step="0.1"></div>
        <div class="field"><label>Altura (cm)</label><input id="f-alt" class="f" type="number" step="0.1"></div>
        <div class="field"><label>Glicemia (mg/dL)</label><input id="f-gli" class="f" type="number"></div>
      </div></div></div>

    <div class="sbox a"><div class="h"><span class="bdg">A</span> Avaliação</div><div class="bd">
      <textarea id="f-a" class="f" placeholder="Avaliação / raciocínio clínico…"></textarea></div></div>

    <div class="sbox p"><div class="h"><span class="bdg">P</span> Plano</div><div class="bd">
      <div class="field"><textarea id="f-p" class="f" placeholder="Plano de cuidado…"></textarea></div>
      <div class="ptabs">
        <button class="ptab active" data-pt="ex">Exames</button>
        <button class="ptab" data-pt="rx">Prescrição</button>
      </div>
      <div data-panel="ex">
        <button class="btn primary sm" id="open-exam">+ Adicionar exame</button>
        <table style="margin-top:10px"><thead><tr><th>Exame</th><th>Código SIGTAP</th><th></th></tr></thead><tbody id="ex-tbody"></tbody></table>
        <div id="ex-empty" class="muted" style="margin-top:8px">Nenhum exame adicionado.</div>
      </div>
      <div data-panel="rx" class="hidden">
        <button class="btn primary sm" id="open-presc">+ Adicionar medicamento</button>
        <table style="margin-top:10px"><thead><tr><th>Medicamento</th><th>Posologia</th><th>Qtd.</th><th></th></tr></thead><tbody id="rx-tbody"></tbody></table>
        <div id="rx-empty" class="muted" style="margin-top:8px">Nenhum medicamento prescrito.</div>
      </div>
    </div></div>

    <div style="display:flex;justify-content:flex-end;gap:10px;padding-bottom:30px">
      <button class="btn ghost" id="btn-cancelar">Cancelar</button>
      <button class="btn primary" id="btn-finalizar">Finalizar e salvar atendimento</button>
    </div>
   </div>`);

  // tabs do plano
  c.querySelectorAll('.ptab').forEach(t=>t.onclick=()=>{
    c.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('active',x===t));
    c.querySelectorAll('[data-panel]').forEach(pn=>pn.classList.toggle('hidden',pn.dataset.panel!==t.dataset.pt));
  });
  $('open-exam').onclick=()=>{ renderExChips(); openM('m-exam'); };
  $('open-presc').onclick=()=> openM('m-presc');
  $('btn-cancelar').onclick=()=>{ atendAtual=null; renderMain(); };
  $('btn-finalizar').onclick=finalizar;
  renderExTable(); renderRxTable();
}

// ---------- busca de exames (SIGTAP via RPC) ----------
function renderExChips(){
  $('ex-chips').innerHTML=examItens.map((e,i)=>'<span class="chipx">'+esc(e.no_procedimento)+' <span class="chip">'+esc(e.co_procedimento)+'</span><button data-i="'+i+'">✕</button></span>').join('');
  $('ex-chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{ examItens.splice(+b.dataset.i,1); renderExChips(); });
}
function renderExTable(){
  const tb=$('ex-tbody'); if(!tb) return;
  tb.innerHTML=examItens.map((e,i)=>'<tr><td>'+esc(e.no_procedimento)+'</td><td><span class="chip">'+esc(e.co_procedimento)+'</span></td><td><button class="rm" data-i="'+i+'">✕</button></td></tr>').join('');
  $('ex-empty').style.display=examItens.length?'none':'block';
  tb.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ examItens.splice(+b.dataset.i,1); renderExTable(); });
}
$('ex-add').onclick=()=>{ renderExTable(); closeM('m-exam'); };
taBind($('ex-search'),$('ex-list'),async q=>{
  const {data,error}=await sb.rpc('buscar_exames',{p_termo:q});
  if(error){ toast('Erro na busca de exames: '+error.message,true); return []; }
  return (data||[]).map(e=>({label:e.no_procedimento,sub:'Código '+e.co_procedimento,value:e}));
},opt=>{ const e=opt.value; if(!examItens.find(x=>x.co_procedimento===e.co_procedimento)) examItens.push({co_procedimento:e.co_procedimento,no_procedimento:e.no_procedimento}); $('ex-search').value=''; renderExChips(); });

// ---------- prescrição ----------
function renderRxTable(){
  const tb=$('rx-tbody'); if(!tb) return;
  tb.innerHTML=prescItens.map((m,i)=>'<tr><td>'+esc(m.medicamento)+'</td><td class="muted">'+esc([m.via,m.frequencia,m.duracao].filter(Boolean).join(' · ')||'—')+'</td><td>'+esc(m.quantidade||'—')+'</td><td><button class="rm" data-i="'+i+'">✕</button></td></tr>').join('');
  $('rx-empty').style.display=prescItens.length?'none':'block';
  tb.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ prescItens.splice(+b.dataset.i,1); renderRxTable(); });
}
$('pr-add').onclick=()=>{
  const med=$('pr-med').value.trim(); if(!med){ toast('Informe o medicamento',true); return; }
  prescItens.push({medicamento:med,via:$('pr-via').value,dose:$('pr-dose').value,frequencia:$('pr-freq').value,duracao:$('pr-dur').value,quantidade:$('pr-qtd').value,uso_continuo:$('pr-cont').checked});
  ['pr-med','pr-dose','pr-freq','pr-dur','pr-qtd'].forEach(i=>$(i).value=''); $('pr-cont').checked=false;
  renderRxTable(); closeM('m-presc');
};

// ---------- finalizar: grava tudo no Supabase ----------
async function finalizar(){
  const btn=$('btn-finalizar'); btn.disabled=true; btn.textContent='Salvando…';
  const num=id=>{ const v=$(id).value.trim(); return v===''?null:Number(v); };
  try{
    const {data:at,error:e1}=await sb.from('pep_atendimentos').insert({
      paciente_id:pacienteSel.id, tipo_atendimento:$('f-tipo').value,
      subjetivo:$('f-s').value||null, objetivo:$('f-o').value||null, avaliacao:$('f-a').value||null, plano:$('f-p').value||null,
      pa_sistolica:num('f-pas'), pa_diastolica:num('f-pad'), fc:num('f-fc'), peso_kg:num('f-peso'), altura_cm:num('f-alt'), glicemia_capilar:num('f-gli'),
      status:'finalizado'
    }).select().single();
    if(e1) throw e1;
    if(examItens.length){
      const {data:sol,error:e2}=await sb.from('pep_solicitacoes_exames').insert({atendimento_id:at.id,tipo:'comum',cid10:$('ex-cid').value||null,justificativa:$('ex-just').value||null}).select().single();
      if(e2) throw e2;
      const {error:e3}=await sb.from('pep_solicitacao_itens').insert(examItens.map(e=>({solicitacao_id:sol.id,co_procedimento:e.co_procedimento,no_procedimento:e.no_procedimento})));
      if(e3) throw e3;
    }
    if(prescItens.length){
      const {data:rec,error:e4}=await sb.from('pep_prescricoes').insert({atendimento_id:at.id,tipo_receita:'comum'}).select().single();
      if(e4) throw e4;
      const {error:e5}=await sb.from('pep_prescricao_itens').insert(prescItens.map((m,i)=>({prescricao_id:rec.id,...m,ordem:i+1})));
      if(e5) throw e5;
    }
    toast('Atendimento salvo ✓'); atendAtual=null; renderMain();
  }catch(err){ toast('Erro ao salvar: '+(err.message||err),true); }
  finally{ btn.disabled=false; btn.textContent='Finalizar e salvar atendimento'; }
}

// ---------- utils ----------
function openM(id){ $(id).classList.add('open'); }
function closeM(id){ $(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>e.target.closest('.overlay').classList.remove('open'));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); }));
$('menu-btn').onclick=()=>$('sidebar').classList.toggle('open');

function taBind(input,list,fetcher,onPick){
  let timer;
  input.addEventListener('input',()=>{ clearTimeout(timer); const q=input.value.trim();
    if(q.length<2){ list.classList.remove('open'); return; }
    timer=setTimeout(async()=>{
      const opts=await fetcher(q);
      list.innerHTML=opts.length?opts.map((o,i)=>'<div class="ta-opt" data-i="'+i+'"><div class="t">'+esc(o.label)+'</div>'+(o.sub?'<div class="c">'+esc(o.sub)+'</div>':'')+'</div>').join(''):'<div class="ta-opt c">Nenhum resultado</div>';
      list.classList.add('open');
      list.querySelectorAll('.ta-opt[data-i]').forEach((d,i)=> d.onclick=()=>{ onPick(opts[i]); list.classList.remove('open'); });
    },250);
  });
  input.addEventListener('blur',()=> setTimeout(()=>list.classList.remove('open'),180));
}

boot();
</script>
