<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento — Prontuário Pessoal</title>
<!-- Supabase JS (UMD) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#eef1f5;--surface:#fff;--surface-2:#f6f8fa;--fg:#1a2733;--muted:#5c6b7a;--line:#dde3ea;
    --brand:#0a5c9e;--brand-700:#084a80;--brand-050:#e8f1f9;--ok:#15803d;--err:#b42318;
    --s:#d64d6e;--s-bg:#fdecf0;--o:#1f6fb2;--o-bg:#e7f0f8;--a:#b57d12;--a-bg:#fcf3e0;--p:#1f9d57;--p-bg:#e7f6ee;
    --radius:10px;--shadow:0 1px 2px rgba(16,32,48,.06),0 2px 8px rgba(16,32,48,.05);
    --font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1621;--surface:#15202d;--surface-2:#1b2836;--fg:#e6edf3;--muted:#90a0b0;--line:#273341;
    --brand:#2f8fd8;--brand-700:#56a6e4;--brand-050:#13293c;color-scheme:dark;
    --s-bg:#2b161c;--o-bg:#12222f;--a-bg:#272013;--p-bg:#112418;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5}
  h1,h2,h3{margin:0}
  .topbar{background:var(--brand-700);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
  .brand{font-weight:700;display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--brand-700);display:grid;place-items:center}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600;border-bottom:1px solid var(--line)}
  .card-b{padding:16px}
  .badge{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:#fff}
  .sec-s .card-h{background:var(--s-bg)} .sec-s .badge{background:var(--s)}
  .sec-o .card-h{background:var(--o-bg)} .sec-o .badge{background:var(--o)}
  .sec-a .card-h{background:var(--a-bg)} .sec-a .badge{background:var(--a)}
  .sec-p .card-h{background:var(--p-bg)} .sec-p .badge{background:var(--p)}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
  input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;outline:0}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-050)}
  textarea{min-height:76px;resize:vertical}
  .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .field{margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--fg)}
  .btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-700)}
  .btn.outline{background:transparent;border-color:var(--brand);color:var(--brand)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--brand-050);color:var(--brand)}
  .muted{color:var(--muted);font-size:12.5px}
  .rm{color:var(--err);border:0;background:transparent;cursor:pointer;font-size:16px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,20,30,.5);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;margin:auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:18px}
  .modal-b{padding:18px 20px}.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
  .modal-x{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer}
  .ta{position:relative}
  .ta-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow:auto;z-index:5;display:none}
  .ta-list.open{display:block}
  .ta-opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .ta-opt:hover{background:var(--brand-050)}
  .ta-opt .t{font-weight:600;font-size:13.5px}.ta-opt .c{font-size:11.5px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--brand-050);color:var(--brand);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 11px;font-size:12.5px;font-weight:600}
  .chip button{border:0;background:transparent;color:var(--brand);cursor:pointer}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .toast.show{opacity:1}
  .toast.err{background:var(--err);color:#fff}
  .hidden{display:none!important}
  .config-warn{background:#fff6ea;border:1px solid #f4d29a;color:#7a4b06;padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px}
  .login{max-width:360px;margin:60px auto}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">P</span> Prontuário Pessoal — Atendimento</div>
  <div id="whoami" class="muted" style="color:#cfe0ef"></div>
</div>

<!-- ===== LOGIN ===== -->
<div id="view-login" class="wrap hidden">
  <div class="card login"><div class="card-b">
    <h2 style="margin-bottom:12px">Entrar</h2>
    <div id="cfgwarn" class="config-warn hidden"></div>
    <div class="field"><label>E-mail</label><input id="li-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="li-btn" style="width:100%">Entrar</button>
  </div></div>
</div>

<!-- ===== ATENDIMENTO ===== -->
<div id="view-app" class="wrap hidden">

  <div class="card"><div class="card-b">
    <div class="row">
      <div class="field" style="margin:0">
        <label>Paciente</label>
        <div class="ta">
          <input id="pac-search" placeholder="Buscar paciente por nome…" autocomplete="off">
          <div class="ta-list" id="pac-list"></div>
        </div>
        <div id="pac-sel" class="muted" style="margin-top:6px"></div>
      </div>
      <div class="field" style="margin:0">
        <label>Tipo de atendimento</label>
        <select id="tipo-atend">
          <option value="no_dia">Consulta no dia</option>
          <option value="agendada">Consulta agendada</option>
          <option value="cuidado_continuado">Cuidado continuado</option>
          <option value="urgencia">Urgência</option>
        </select>
      </div>
    </div>
  </div></div>

  <div class="card sec-s"><div class="card-h"><span class="badge">S</span> Subjetivo</div><div class="card-b">
    <textarea id="s-text" placeholder="Queixa e história do paciente…"></textarea>
  </div></div>

  <div class="card sec-o"><div class="card-h"><span class="badge">O</span> Objetivo</div><div class="card-b">
    <div class="field"><textarea id="o-text" placeholder="Exame físico…"></textarea></div>
    <div class="row">
      <div class="field" style="margin:0"><label>PA sistólica</label><input id="v-pas" type="number" placeholder="120"></div>
      <div class="field" style="margin:0"><label>PA diastólica</label><input id="v-pad" type="number" placeholder="80"></div>
      <div class="field" style="margin:0"><label>FC (bpm)</label><input id="v-fc" type="number" placeholder="72"></div>
      <div class="field" style="margin:0"><label>Peso (kg)</label><input id="v-peso" type="number" step="0.1" placeholder="72.0"></div>
      <div class="field" style="margin:0"><label>Altura (cm)</label><input id="v-alt" type="number" step="0.1" placeholder="162"></div>
      <div class="field" style="margin:0"><label>Glicemia (mg/dL)</label><input id="v-gli" type="number" placeholder="—"></div>
    </div>
  </div></div>

  <div class="card sec-a"><div class="card-h"><span class="badge">A</span> Avaliação</div><div class="card-b">
    <textarea id="a-text" placeholder="Avaliação / raciocínio clínico…"></textarea>
  </div></div>

  <div class="card sec-p"><div class="card-h"><span class="badge">P</span> Plano</div><div class="card-b">
    <div class="field"><textarea id="p-text" placeholder="Plano de cuidado…"></textarea></div>

    <h3 style="font-size:14px;margin:6px 0 8px">Solicitação de exames</h3>
    <button class="btn primary sm" id="open-exam">+ Adicionar exame</button>
    <table style="margin-top:10px"><thead><tr><th>Exame</th><th>Código SIGTAP</th><th></th></tr></thead><tbody id="exam-tbody"></tbody></table>
    <div id="exam-empty" class="muted" style="margin-top:8px">Nenhum exame adicionado.</div>

    <h3 style="font-size:14px;margin:18px 0 8px">Prescrição de medicamentos</h3>
    <button class="btn primary sm" id="open-presc">+ Adicionar medicamento</button>
    <table style="margin-top:10px"><thead><tr><th>Medicamento</th><th>Posologia</th><th>Qtd.</th><th></th></tr></thead><tbody id="presc-tbody"></tbody></table>
    <div id="presc-empty" class="muted" style="margin-top:8px">Nenhum medicamento prescrito.</div>
  </div></div>

  <div style="display:flex;justify-content:flex-end;gap:10px;padding-bottom:30px">
    <button class="btn outline" id="btn-logout">Sair</button>
    <button class="btn primary" id="btn-finalizar">Finalizar e salvar atendimento</button>
  </div>
</div>

<!-- ===== MODAL EXAME ===== -->
<div class="overlay" id="modal-exam"><div class="modal">
  <div class="modal-h"><span>Solicitar exame</span><button class="modal-x" data-close>✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Exames (busca na SIGTAP)</label>
      <div class="ta"><input id="exam-search" placeholder="Digite: hemo, glicose, tsh, ultrassom…" autocomplete="off"><div class="ta-list" id="exam-list"></div></div>
      <div class="chips" id="exam-chips"></div>
    </div>
    <div class="field"><label>CID 10 (opcional)</label><input id="exam-cid" placeholder="Ex.: E11"></div>
    <div class="field" style="margin:0"><label>Justificativa</label><textarea id="exam-just" placeholder="Justificativa do procedimento"></textarea></div>
  </div>
  <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="exam-add">Adicionar ao atendimento</button></div>
</div></div>

<!-- ===== MODAL PRESCRIÇÃO ===== -->
<div class="overlay" id="modal-presc"><div class="modal">
  <div class="modal-h"><span>Prescrição de medicamento</span><button class="modal-x" data-close>✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Medicamento</label><input id="pr-med" placeholder="Ex.: Losartana 50 mg"></div>
    <div class="row">
      <div class="field" style="margin:0"><label>Via</label><select id="pr-via"><option>Via oral</option><option>Sublingual</option><option>Intramuscular</option><option>Endovenosa</option><option>Tópica</option><option>Inalatória</option></select></div>
      <div class="field" style="margin:0"><label>Dose</label><input id="pr-dose" placeholder="1 comprimido"></div>
      <div class="field" style="margin:0"><label>Frequência</label><input id="pr-freq" placeholder="12/12h"></div>
      <div class="field" style="margin:0"><label>Duração</label><input id="pr-dur" placeholder="30 dias"></div>
      <div class="field" style="margin:0"><label>Quantidade</label><input id="pr-qtd" placeholder="60"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-weight:400;color:var(--fg)"><input type="checkbox" id="pr-cont" style="width:auto"> Uso contínuo</label>
  </div>
  <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="pr-add">Adicionar à prescrição</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
// =============================================================================
// CONFIG — preencha com os dados do seu projeto Supabase.
// A ANON KEY é pública/segura no front-end (o RLS protege os dados). NÃO use a service_role aqui.
// =============================================================================
const SUPABASE_URL = "https://joygodczajayygikerno.supabase.co";
// Publishable key (formato novo do Supabase) — segura no front-end; o RLS protege os dados. NÃO use a secret key aqui.
const SUPABASE_ANON_KEY = "sb_publishable_kk6ty_YczpR02xLJouj8EA_-oRjTsT6";
// =============================================================================

const $ = id => document.getElementById(id);
const toast = (msg, err=false) => { const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2600); };

let sb = null, pacienteSel = null;
const examItens = [];   // {co_procedimento, no_procedimento}
const prescItens = [];  // {medicamento, via, dose, frequencia, duracao, quantidade, uso_continuo}

// ---- init / auth ----
function boot(){
  if (!window.supabase || !window.supabase.createClient){ toast('Falha ao carregar a lib do Supabase',true); return; }
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('COLE_')){
    show('login');
    $('cfgwarn').classList.remove('hidden');
    $('cfgwarn').textContent = 'Configure SUPABASE_URL e SUPABASE_ANON_KEY no topo do <script> antes de usar.';
    $('li-btn').disabled = true;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=>{ data.session ? enterApp(data.session) : show('login'); });
  sb.auth.onAuthStateChange((_e, session)=>{ session ? enterApp(session) : show('login'); });
}
function show(view){ $('view-login').classList.toggle('hidden', view!=='login'); $('view-app').classList.toggle('hidden', view!=='app'); }
function enterApp(session){ $('whoami').textContent = session.user.email || ''; show('app'); }

$('li-btn').addEventListener('click', async ()=>{
  const { error } = await sb.auth.signInWithPassword({ email:$('li-email').value.trim(), password:$('li-pass').value });
  if (error) toast(error.message, true);
});
$('btn-logout').addEventListener('click', ()=> sb.auth.signOut());

// ---- busca de paciente ----
taBind($('pac-search'), $('pac-list'), async (q)=>{
  const { data, error } = await sb.from('pacientes').select('id, nome').ilike('nome', '%'+q+'%').limit(8);
  if (error){ toast('Erro ao buscar paciente: '+error.message, true); return []; }
  return (data||[]).map(p=>({ label:p.nome, sub:'', value:p }));
}, (opt)=>{ pacienteSel = opt.value; $('pac-search').value = opt.value.nome; $('pac-sel').textContent = 'Selecionado: '+opt.value.nome; });

// ---- busca de exames (RPC buscar_exames na SIGTAP) ----
taBind($('exam-search'), $('exam-list'), async (q)=>{
  const { data, error } = await sb.rpc('buscar_exames', { p_termo:q });
  if (error){ toast('Erro na busca de exames: '+error.message, true); return []; }
  return (data||[]).map(e=>({ label:e.no_procedimento, sub:'Código '+e.co_procedimento, value:e }));
}, (opt)=>{ addExam(opt.value); $('exam-search').value=''; });

function addExam(e){
  if (examItens.find(x=>x.co_procedimento===e.co_procedimento)) return;
  examItens.push({ co_procedimento:e.co_procedimento, no_procedimento:e.no_procedimento });
  renderChips();
}
function renderChips(){
  $('exam-chips').innerHTML = examItens.map((e,i)=>`<span class="chip">${e.no_procedimento} <span class="pill">${e.co_procedimento}</span><button data-i="${i}">✕</button></span>`).join('');
  $('exam-chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{ examItens.splice(+b.dataset.i,1); renderChips(); });
}
function renderExamTable(){
  $('exam-tbody').innerHTML = examItens.map((e,i)=>`<tr><td>${e.no_procedimento}</td><td><span class="pill">${e.co_procedimento}</span></td><td><button class="rm" data-i="${i}">✕</button></td></tr>`).join('');
  $('exam-empty').style.display = examItens.length ? 'none':'block';
  $('exam-tbody').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ examItens.splice(+b.dataset.i,1); renderExamTable(); });
}

// ---- modais ----
$('open-exam').onclick = ()=>{ renderChips(); openM('modal-exam'); };
$('exam-add').onclick = ()=>{ renderExamTable(); closeM('modal-exam'); };
$('open-presc').onclick = ()=> openM('modal-presc');
$('pr-add').onclick = ()=>{
  const med = $('pr-med').value.trim(); if(!med){ toast('Informe o medicamento',true); return; }
  prescItens.push({ medicamento:med, via:$('pr-via').value, dose:$('pr-dose').value, frequencia:$('pr-freq').value,
    duracao:$('pr-dur').value, quantidade:$('pr-qtd').value, uso_continuo:$('pr-cont').checked });
  ['pr-med','pr-dose','pr-freq','pr-dur','pr-qtd'].forEach(id=>$(id).value=''); $('pr-cont').checked=false;
  renderPrescTable(); closeM('modal-presc');
};
function renderPrescTable(){
  $('presc-tbody').innerHTML = prescItens.map((m,i)=>`<tr><td>${m.medicamento}</td><td class="muted">${[m.via,m.frequencia,m.duracao].filter(Boolean).join(' · ')||'—'}</td><td>${m.quantidade||'—'}</td><td><button class="rm" data-i="${i}">✕</button></td></tr>`).join('');
  $('presc-empty').style.display = prescItens.length ? 'none':'block';
  $('presc-tbody').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ prescItens.splice(+b.dataset.i,1); renderPrescTable(); });
}
function openM(id){ $(id).classList.add('open'); }
function closeM(id){ $(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>e.target.closest('.overlay').classList.remove('open'));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); }));

// ---- typeahead genérico ----
function taBind(input, list, fetcher, onPick){
  let timer;
  input.addEventListener('input', ()=>{
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2){ list.classList.remove('open'); return; }
    timer = setTimeout(async ()=>{
      const opts = await fetcher(q);
      list.innerHTML = opts.length ? opts.map((o,i)=>`<div class="ta-opt" data-i="${i}"><div class="t">${o.label}</div>${o.sub?`<div class="c">${o.sub}</div>`:''}</div>`).join('') : '<div class="ta-opt c">Nenhum resultado</div>';
      list.classList.add('open');
      list.querySelectorAll('.ta-opt[data-i]').forEach((el,i)=> el.onclick=()=>{ onPick(opts[i]); list.classList.remove('open'); });
    }, 250);
  });
  input.addEventListener('blur', ()=> setTimeout(()=>list.classList.remove('open'), 180));
}

// ---- FINALIZAR: grava atendimento + solicitação + prescrição ----
$('btn-finalizar').addEventListener('click', async ()=>{
  if (!pacienteSel){ toast('Selecione um paciente', true); return; }
  const btn = $('btn-finalizar'); btn.disabled = true; btn.textContent = 'Salvando…';
  try{
    // 1) atendimento (profissional_id entra via default auth.uid() no banco)
    const { data: at, error: e1 } = await sb.from('atendimentos').insert({
      paciente_id: pacienteSel.id,
      tipo_atendimento: $('tipo-atend').value,
      subjetivo: $('s-text').value || null,
      objetivo: $('o-text').value || null,
      avaliacao: $('a-text').value || null,
      plano: $('p-text').value || null,
      pa_sistolica: numOrNull('v-pas'), pa_diastolica: numOrNull('v-pad'), fc: numOrNull('v-fc'),
      peso_kg: numOrNull('v-peso'), altura_cm: numOrNull('v-alt'), glicemia_capilar: numOrNull('v-gli'),
      status: 'finalizado'
    }).select().single();
    if (e1) throw e1;

    // 2) solicitação de exames (cabeçalho + itens)
    if (examItens.length){
      const { data: sol, error: e2 } = await sb.from('solicitacoes_exames').insert({
        atendimento_id: at.id, tipo:'comum', cid10: $('exam-cid').value || null, justificativa: $('exam-just').value || null
      }).select().single();
      if (e2) throw e2;
      const { error: e3 } = await sb.from('solicitacao_itens').insert(
        examItens.map(e=>({ solicitacao_id: sol.id, co_procedimento:e.co_procedimento, no_procedimento:e.no_procedimento }))
      );
      if (e3) throw e3;
    }

    // 3) prescrição (cabeçalho + itens)
    if (prescItens.length){
      const { data: rec, error: e4 } = await sb.from('prescricoes').insert({ atendimento_id: at.id, tipo_receita:'comum' }).select().single();
      if (e4) throw e4;
      const { error: e5 } = await sb.from('prescricao_itens').insert(
        prescItens.map((m,idx)=>({ prescricao_id: rec.id, ...m, ordem: idx+1 }))
      );
      if (e5) throw e5;
    }

    toast('Atendimento salvo ✓');
    resetForm();
  }catch(err){
    toast('Erro ao salvar: '+(err.message||err), true);
  }finally{
    btn.disabled = false; btn.textContent = 'Finalizar e salvar atendimento';
  }
});
function numOrNull(id){ const v = $(id).value.trim(); return v===''?null:Number(v); }
function resetForm(){
  pacienteSel=null; examItens.length=0; prescItens.length=0;
  ['pac-search','pac-sel','s-text','o-text','a-text','p-text','v-pas','v-pad','v-fc','v-peso','v-alt','v-gli','exam-cid','exam-just'].forEach(id=>{ if($(id)) $(id).value=''; });
  $('pac-sel').textContent=''; renderExamTable(); renderPrescTable();
}

boot();
</script>
